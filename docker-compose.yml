services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # По умолчанию сервис работает с локальной моделью в контейнере ollama:
      # запуск не требует платных ключей.
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      CHAR_BUDGET: ${CHAR_BUDGET:-24000}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
